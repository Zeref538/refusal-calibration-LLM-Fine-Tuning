# v14_seed1 — seed replicate of the 3B run — the headline result held to its own standard
# Generated by make_configs.py. Edit the table there, not this file.
base_model: unsloth/Qwen2.5-3B-Instruct-bnb-4bit
seed: 1

lora:
  r: 16
  alpha: 16
  dropout: 0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  data_path: data/mix_50_50.jsonl
  output_dir: runs/v14_seed1
  epochs: 2
  batch_size: 2
  grad_accum: 8
  lr: 2.0e-4
  max_seq_len: 1024
  val_fraction: 0.05
  max_steps: -1
